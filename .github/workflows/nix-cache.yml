# 把本仓的字体包构建出来推进 attic 私有缓存 (缓存名由 `ATTIC_CACHE` 给出).
#
# 本仓是公开仓, 所以缓存地址 / 公钥 / token 一律走 secrets, 仓库里只有引用 (见 .github/actions/setup).
# 只做构建与推送, 不跑 `nix flake check`.
#
# 每个架构各跑一遍: 字体包本身与架构无关 (`stdenvNoCC` + `fetchurl` + `unzip`/`p7zip`), 但解压工具与
# 产物是逐架构的 store 路径, 所以两个架构都要推. aarch64 走 GitHub 的 arm runner.
name: nix-cache

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".editorconfig"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-linux
            runner: ubuntu-24.04
          - arch: aarch64-linux
            runner: ubuntu-24.04-arm
    env:
      ATTIC_TOKEN: ${{ secrets.ATTIC_CI_TOKEN }}
      ATTIC_URL: ${{ secrets.ATTIC_URL }}
      ATTIC_CACHE: ${{ secrets.ATTIC_CACHE }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          token: ${{ secrets.ATTIC_CI_TOKEN }}
          url: ${{ secrets.ATTIC_URL }}
          hosts_entry: ${{ secrets.ATTIC_HOSTS_ENTRY }}
          nix_config: |
            extra-experimental-features = nix-command flakes
            extra-substituters = ${{ secrets.ATTIC_URL }}/${{ secrets.ATTIC_CACHE }}
            extra-trusted-public-keys = ${{ secrets.ATTIC_PUBLIC_KEY }}
            netrc-file = /etc/nix/netrc

      - name: build ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mapfile -t attrs < <(nix eval --json ".#packages.${{ matrix.arch }}" --apply builtins.attrNames | jq -r '.[]')
          echo "packages: ${attrs[*]}"
          test "${#attrs[@]}" -gt 0
          # 用 --print-out-paths 收产物: `-o <path>` 挂多个 installable 时只会给一个符号链接,
          # 按 `<path>/*` 取路径会取空 —— attic 就变成"什么都没推"还退出 0.
          nix build --no-link --keep-going --show-trace --print-out-paths "${attrs[@]/#/.#}" > /tmp/paths.txt
          # 固定输出的源 (Windows 安装映像 / MiSans 整合包) 是构建输入, 不在产物的引用闭包里, 得单独推.
          # 它挂在包的 passthru 上, 而 nix 只肯 build 派生或路径 (`found a set`), 所以取 outPath 拼进来.
          for attr in "${attrs[@]}"; do
            nix eval --raw ".#$attr.passthru.sources" \
              --apply 'x: builtins.concatStringsSep "\n" (map (d: d.outPath) (builtins.attrValues x))' \
              >> /tmp/paths.txt 2>/dev/null || true
          done
          sort -u -o /tmp/paths.txt /tmp/paths.txt
          cat /tmp/paths.txt

      - name: push ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test -n "$ATTIC_TOKEN"
          mapfile -t paths < <(while read -r path; do [ -e "$path" ] && printf '%s\n' "$path"; done < /tmp/paths.txt)
          test "${#paths[@]}" -gt 0
          ATTIC=$(cat /tmp/attic-path)/bin/attic
          "$ATTIC" login pfm "$ATTIC_URL" "$ATTIC_TOKEN"
          "$ATTIC" push "pfm:$ATTIC_CACHE" "${paths[@]}"
          df -h / | tail -1
