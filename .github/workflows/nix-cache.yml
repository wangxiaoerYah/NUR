name: nix-cache

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".editorconfig"
      - ".github/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".editorconfig"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    uses: ./.github/workflows/plan.yml

  build:
    name: build
    needs: plan
    # fork PR 没有 secrets, setup 的 token 断言会失败; 只拦 fork 的 PR, 本仓 PR 与 push 照常
    if: ${{ needs.plan.outputs.matrix != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/build-push.yml
    with:
      matrix: ${{ needs.plan.outputs.matrix }}
    secrets:
      attic_token: ${{ secrets.ATTIC_CI_TOKEN }}
      attic_url: ${{ secrets.ATTIC_URL }}
      cache_name: ${{ secrets.ATTIC_CACHE }}
      hosts_entry: ${{ secrets.ATTIC_HOSTS_ENTRY }}
      substituters: ${{ secrets.ATTIC_URL }}/${{ secrets.ATTIC_CACHE }}
      trusted_keys: ${{ secrets.ATTIC_PUBLIC_KEY }}
