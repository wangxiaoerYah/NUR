name: nix-cache

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".editorconfig"
      - ".github/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".editorconfig"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - id: m
        run: |
          set -euo pipefail
          entries=()
          for arch in x86_64-linux aarch64-linux; do
            installables=$(nix eval --json ".#packages.$arch" --apply builtins.attrNames | jq -r '.[]' | sed 's|^|.#|' | tr '\n' ' ')
            [ -n "$installables" ] || continue
            runner=$([ "$arch" = x86_64-linux ] && echo ubuntu-latest || echo ubuntu-26.04-arm)
            entries+=("$(jq -cn --arg i "$installables" --arg l "$arch" --arg r "$runner" '{label:$l, runner:$r, installables:$i}')")
          done
          test "${#entries[@]}" -gt 0
          matrix=$(IFS=,; printf '{include:[%s]}' "${entries[*]}")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$matrix"

  build:
    name: build
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '' }}
    uses: ./.github/workflows/build-push.yml
    with:
      matrix: ${{ needs.plan.outputs.matrix }}
    secrets:
      attic_token: ${{ secrets.ATTIC_CI_TOKEN }}
      attic_url: ${{ secrets.ATTIC_URL }}
      cache_name: ${{ secrets.ATTIC_CACHE }}
      hosts_entry: ${{ secrets.ATTIC_HOSTS_ENTRY }}
      substituters: ${{ secrets.ATTIC_URL }}/${{ secrets.ATTIC_CACHE }}
      trusted_keys: ${{ secrets.ATTIC_PUBLIC_KEY }}
