name: nix-cache

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".editorconfig"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nix-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    uses: ./.github/workflows/plan.yml
    with:
      cache_url: ${{ vars.NIKS3_URL }}
    secrets:
      niks3_token: ${{ secrets.NIKS3_TOKEN }}

  build:
    name: build
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '{"include":[]}' }}
    uses: ./.github/workflows/build-push.yml
    with:
      matrix: ${{ needs.plan.outputs.matrix }}
      cache_url: ${{ vars.NIKS3_URL }}
    secrets:
      niks3_token: ${{ secrets.NIKS3_TOKEN }}
