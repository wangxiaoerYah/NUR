name: nix-cache

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".editorconfig"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nix-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache_url: ${{ secrets.NIKS3_URL }}
          cache_token: ${{ secrets.NIKS3_TOKEN }}
      - id: plan
        uses: ./.github/actions/plan
        with:
          cache_url: ${{ secrets.NIKS3_URL }}

  build:
    name: ${{ matrix.label }}
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '{"include":[]}' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: jlumbroso/free-disk-space@main
      - uses: ./.github/actions/setup
        with:
          cache_url: ${{ secrets.NIKS3_URL }}
          cache_token: ${{ secrets.NIKS3_TOKEN }}
          substituters: ${{ matrix.extra-substituters }}
          trusted_keys: ${{ matrix.extra-keys }}
      - uses: ./.github/actions/build-push
        env:
          NIKS3_TOKEN: ${{ secrets.NIKS3_TOKEN }}
        with:
          cache_url: ${{ secrets.NIKS3_URL }}
          installables: ${{ matrix.installables }}
          nix_flags: ${{ matrix.nix-flags }}
          push_inputs: ${{ github.event_name == 'workflow_dispatch' || contains(toJSON(github.event.commits), 'flake.lock') }}
