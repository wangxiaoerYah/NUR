name: build-push

on:
  workflow_call:
    inputs:
      matrix:
        description: "json: {include: [{label, runner, installables, nix-flags?, extra-substituters?, extra-keys?}]}"
        required: true
        type: string
      ref:
        description: "要构建的分支/提交 (空 = 调用方的默认 ref)"
        required: false
        type: string
        default: ""
      cache_url:
        description: "niks3 server URL (从 /api/cache-config 取 substituter 与公钥)"
        required: true
        type: string
      substituters:
        description: "额外 substituters (可选)"
        required: false
        type: string
        default: ""
      trusted_keys:
        description: "额外 trusted public keys (可选)"
        required: false
        type: string
        default: ""
    secrets:
      niks3_token:
        description: "读侧门控用的静态 token (写被门控时也需要它来拉取; 空 = 只靠 cache.nixos.org)"
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    env:
      INSTALLABLES: ${{ matrix.installables }}
      NIX_FLAGS: ${{ matrix.nix-flags }}
      CACHE_URL: ${{ inputs.cache_url }}
      PUSH_INPUTS: ${{ github.event_name == 'workflow_dispatch' || contains(toJSON(github.event.commits), 'flake.lock') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: jlumbroso/free-disk-space@v2

      - uses: wangxiaoerYah/NUR/.github/actions/setup@main
        with:
          substituters: ${{ inputs.substituters }} ${{ matrix.extra-substituters }}
          trusted_keys: ${{ inputs.trusted_keys }} ${{ matrix.extra-keys }}

      # 官方 action: 从 /api/cache-config 取 substituter 与公钥, 注册 post-build-hook 逐条上传,
      # post 步骤 drain 队列; 推送认证走 GitHub OIDC (不需要长期 token), 也不需要 /etc/hosts 指源站.
      - id: niks3
        uses: Mic92/niks3-action@v1
        with:
          server-url: ${{ inputs.cache_url }}

      # 读侧是门控的: 构建时的拉取也要带凭据 (access-tokens 走 Bearer, 等价 netrc 的 password).
      - name: gated read credentials
        env:
          NIKS3_TOKEN: ${{ secrets.niks3_token }}
        run: |
          set -euo pipefail
          if [ -z "${NIKS3_TOKEN:-}" ]; then
            echo "::warning::没有 niks3_token, 拉取只靠 cache.nixos.org 兜底"
            exit 0
          fi
          host=$(printf '%s' "$CACHE_URL" | sed -E 's#^https?://##; s#/.*##')
          echo "access-tokens = $host $NIKS3_TOKEN" | sudo tee -a /etc/nix/nix.conf >/dev/null
          umask 077
          printf '%s' "$NIKS3_TOKEN" > "$RUNNER_TEMP/niks3.token"

      - name: niks3 client
        run: nix build nixpkgs#niks3 --no-link --print-out-paths > "$RUNNER_TEMP/niks3-path"

      - name: build and push
        run: |
          set -euo pipefail
          NIKS3="$(cat "$RUNNER_TEMP/niks3-path")/bin/niks3"
          TOKEN_SCRIPT="${{ steps.niks3.outputs.auth-token-script }}"
          if [ -s "$RUNNER_TEMP/niks3.token" ]; then
            AUTH=(--auth-token-path "$RUNNER_TEMP/niks3.token")
          elif [ -n "$TOKEN_SCRIPT" ]; then
            AUTH=(--auth-token-script "$TOKEN_SCRIPT")
          else
            AUTH=()
          fi
          rc=0

          echo "::group::nix build"
          df -h / | tail -1
          free -m | head -2

          # nix 的 stderr 同步写日志文件 (语句重定向, 无竞态), 同时由后台 tail -f 实时吐进 CI 日志;
          # 只用行改向时 runner 被外部终止就什么都看不到, 故不能省掉 tail.
          log="$RUNNER_TEMP/build.err"
          : > "$log"
          tail -n +1 -f "$log" &
          tail_pid=$!

          attempt=1
          max_attempts=3
          while :; do
            rc=0
            : > "$log"
            # shellcheck disable=SC2086
            nix build --keep-going --show-trace --no-link --print-out-paths $NIX_FLAGS $INSTALLABLES \
              > "$RUNNER_TEMP/paths" 2>> "$log" || rc=$?
            if [ "$rc" = 0 ]; then break; fi
            sleep 1
            echo "nix build 退出码 $rc (第 $attempt 次)"
            df -h / | tail -1
            free -m | head -2
            sudo dmesg --ctime 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -5 || true
            if [ "$attempt" -ge "$max_attempts" ] \
              || ! grep -qE "unable to download|Stream error|HTTP error|could not be realised|no substituter that can build it|Connection reset|timed out" "$RUNNER_TEMP/build.err"; then
              break
            fi
            attempt=$((attempt + 1))
            echo "瞬时的下载/替身失败, 第 $attempt 次重试 (最多 $max_attempts 次)"
            sleep 30
          done
          sleep 1
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          echo "::endgroup::"

          if [ "$rc" = 0 ]; then
            mapfile -t valid < <(grep -v '^$' "$RUNNER_TEMP/paths" || true)
          else
            # shellcheck disable=SC2086
            mapfile -t valid < <(nix path-info --json --json-format 1 $NIX_FLAGS $INSTALLABLES \
              | jq -r 'to_entries[] | select(.value != null) | .key' || true)
          fi

          # action 的 post-build-hook 已经逐条推过; 这里补推一次是幂等的兜底 (hook 在非 trusted-user
          # runner 上退化成事后扫描, 且被取消的 job 走不到 post 步骤).
          if [ "${#valid[@]}" -gt 0 ] && [ "${#AUTH[@]}" -gt 0 ]; then
            echo "pushing ${#valid[@]} paths"
            "$NIKS3" push --server-url "$CACHE_URL" "${AUTH[@]}" "${valid[@]}"
          fi

          if [ "$PUSH_INPUTS" = "true" ] && [ "${#AUTH[@]}" -gt 0 ]; then
            mapfile -t inputs < <(nix flake archive --json \
              | jq -r '[.. | objects | select(has("path")) | .path] | unique[]' || true)
            if [ "${#inputs[@]}" -gt 0 ]; then
              "$NIKS3" push --server-url "$CACHE_URL" "${AUTH[@]}" "${inputs[@]}" || true
            fi
          fi

          df -h / | tail -1
          exit "$rc"
