name: bot-image

on:
  push:
    branches:
      - main
    paths:
      - "packages/nur-bot/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/bot-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: bot-image
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: build image
        run: |
          set -euo pipefail
          nix build .#nur-bot -L --no-link --print-out-paths
      - name: push to ghcr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          img=$(nix build .#nur-bot --no-link --print-out-paths)
          nix run nixpkgs#skopeo -- login ghcr.io -u wangxiaoerYah --password-stdin <<< "$GH_TOKEN"
          nix run nixpkgs#skopeo -- copy "docker-archive:${img}" "docker://ghcr.io/wangxiaoeryah/nur-bot:main"
