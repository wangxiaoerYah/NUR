name: images

on:
  push:
    branches:
      - main
    paths:
      - "images/**"
      - "lib/auto-call.nix"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/images.yml"
  workflow_dispatch:
    inputs:
      clean_keep_versions:
        description: "每个镜像至少保留的版本数 (只清未打 tag 的)"
        required: false
        default: "3"

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: true

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      packages: ${{ steps.m.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - id: m
        run: |
          set -euo pipefail
          attrs=$(nix eval --json ".#images.x86_64-linux" --apply builtins.attrNames)
          matrix=$(echo "$attrs" | jq -c 'if length == 0 then [{attr: "__skip", skip: true}] else map({attr: ., skip: false}) end')
          packages=$(nix eval --json ".#images.x86_64-linux" --apply 'ps: map (n: builtins.baseNameOf (builtins.getAttr n ps).imageName) (builtins.attrNames ps)' \
            | jq -c 'if length == 0 then [{package: "__skip", skip: true}] else map({package: ., skip: false}) end')
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf 'packages=%s\n' "$packages" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.attr }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: ${{ !matrix.skip }}
      - uses: cachix/install-nix-action@v31
        if: ${{ !matrix.skip }}
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: build and push
        if: ${{ !matrix.skip }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          img=$(nix build ".#images.x86_64-linux.${{ matrix.attr }}" --no-link --print-out-paths)
          dest=$(tar -xzOf "$img" manifest.json | jq -r '.[0].RepoTags[0]')
          echo "pushing ${img} to ${dest}"
          nix run nixpkgs#skopeo -- login ghcr.io -u "${{ github.repository_owner }}" --password-stdin <<< "$GH_TOKEN"
          nix run nixpkgs#skopeo -- copy "docker-archive:${img}" "docker://${dest}"

  clean:
    name: clean (${{ matrix.package }})
    needs:
      - build
      - plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.packages) }}
    runs-on: ubuntu-latest
    steps:
      - name: delete untagged versions
        if: ${{ !matrix.skip }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: ${{ inputs.clean_keep_versions || '3' }}
          delete-only-untagged-versions: "true"
