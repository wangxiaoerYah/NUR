name: update

on:
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    name: update
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            extra-experimental-features = nix-command flakes
            access-tokens = github.com=${{ github.token }}
      - name: update and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          nix flake update

          upd_attrs=$(nix eval --json ".#packages.x86_64-linux" --apply \
            'ps: builtins.filter (n: ((builtins.getAttr n ps).passthru or {}) ? updateScript) (builtins.attrNames ps)')
          for attr in $(echo "$upd_attrs" | jq -r '.[]'); do
            echo "== updating $attr"
            nix run ".#${attr}.passthru.updateScript"
          done

          git add -A
          if git diff --cached --quiet; then
            echo "nothing to do"
            exit 0
          fi

          git commit -m "update inputs and packages"

          if git ls-remote --exit-code origin bot/update-inputs >/dev/null 2>&1; then
            git push --force origin HEAD:refs/heads/bot/update-inputs
          else
            git push origin HEAD:refs/heads/bot/update-inputs
          fi

          body="由 update workflow 生成. 构建验证走 PR 的 nix-cache (请在 PR 页允许运行 workflow); 合并后主分支不再重复构建 (产物已在缓存)."
          if gh pr view bot/update-inputs --json number >/dev/null 2>&1; then
            gh pr edit bot/update-inputs --title "update inputs and packages" --body "$body"
          else
            gh pr create --base main --head bot/update-inputs --title "update inputs and packages" --body "$body"
          fi

  cleanup:
    name: cleanup
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.merged && github.event.pull_request.head.ref == 'bot/update-inputs' }}
    runs-on: ubuntu-latest
    steps:
      - name: delete bot branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/bot/update-inputs" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/bot/update-inputs"
            echo "已删除 bot/update-inputs (PR 未合并)"
          else
            echo "bot/update-inputs 不存在, 无需删除"
          fi
