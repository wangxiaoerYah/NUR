name: plan

on:
  workflow_call:
    inputs:
      ref:
        description: "要枚举包的分支/提交 (空 = 调用方的默认 ref)"
        required: false
        type: string
        default: ""
    outputs:
      matrix:
        description: "json: {include: [{label, runner, installables}]}"
        value: ${{ jobs.plan.outputs.matrix }}

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            extra-experimental-features = nix-command flakes
            access-tokens = github.com=${{ github.token }}
      - id: m
        run: |
          set -euo pipefail
          entries=()
          for arch in x86_64-linux aarch64-linux; do
            installables=$(nix eval --json ".#packages.$arch" --apply builtins.attrNames | jq -r '.[]' | sed 's|^|.#|' | tr '\n' ' ')
            [ -n "$installables" ] || continue
            runner=$([ "$arch" = x86_64-linux ] && echo ubuntu-latest || echo ubuntu-26.04-arm)
            entries+=("$(jq -cn --arg i "$installables" --arg l "$arch" --arg r "$runner" '{label:$l, runner:$r, installables:$i}')")
          done
          test "${#entries[@]}" -gt 0
          matrix=$(IFS=,; printf '{include:[%s]}' "${entries[*]}")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$matrix"
