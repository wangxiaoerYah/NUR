name: plan

on:
  workflow_call:
    inputs:
      ref:
        description: "要枚举包的分支/提交 (空 = 调用方的默认 ref)"
        required: false
        type: string
        default: ""
    outputs:
      matrix:
        description: "json: {include: [{label, runner, installables}]}; 全部产物已在缓存时为 {include:[]}"
        value: ${{ jobs.plan.outputs.matrix }}
    secrets:
      attic_token:
        description: "attic ci token (拉取用); 空 = 跳过缓存新鲜度检查 (fork PR 场景)"
        required: false
      substituter:
        description: "要检查的缓存 URL (https://<host>/<cache>); 空 = 跳过检查, 全部进矩阵"
        required: false
      hosts_entry:
        description: "Hosts (源站 IP + 域名)"
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: pin origin, write netrc
        shell: bash
        env:
          ATTIC_TOKEN: ${{ secrets.attic_token }}
          HOSTS_ENTRY: ${{ secrets.hosts_entry }}
        run: |
          set -euo pipefail
          if [ -n "$HOSTS_ENTRY" ]; then
            host=$(printf '%s' "$HOSTS_ENTRY" | awk '{print $2}')
            echo "$HOSTS_ENTRY" | sudo tee -a /etc/hosts >/dev/null
            getent hosts "$host" >/dev/null
          fi
          sudo mkdir -p /etc/nix
          umask 077
          sudo touch /etc/nix/netrc
          sudo chmod 600 /etc/nix/netrc
          if [ -n "$ATTIC_TOKEN" ] && [ -n "$HOSTS_ENTRY" ]; then
            host=$(printf '%s' "$HOSTS_ENTRY" | awk '{print $2}')
            printf 'machine %s login nix password %s\n' "$host" "$ATTIC_TOKEN" | sudo tee /etc/nix/netrc >/dev/null
            sudo chmod 600 /etc/nix/netrc
          fi

      - uses: NixOS/nix-installer-action@main
        with:
          extra-conf: |
            extra-experimental-features = nix-command flakes
            access-tokens = github.com=${{ github.token }}
            netrc-file = /etc/nix/netrc

      - id: m
        env:
          SUBSTITUTER: ${{ secrets.substituter }}
        run: |
          set -euo pipefail
          entries=()
          for arch in x86_64-linux aarch64-linux; do
            pairs=$(nix eval --json ".#packages.$arch" --apply \
              'ps: map (n: { name = n; path = (builtins.getAttr n ps).outPath; }) (builtins.attrNames ps)')
            [ "$(echo "$pairs" | jq 'length')" -gt 0 ] || { echo "::error::.#packages.$arch 为空"; exit 1; }

            installables=""
            while IFS=$'\t' read -r name path; do
              if [ -n "$SUBSTITUTER" ] && nix path-info --store "$SUBSTITUTER" "$path" >/dev/null 2>&1; then
                echo "cached: $name"
              else
                installables="$installables .#$name"
              fi
            done < <(echo "$pairs" | jq -r '.[] | "\(.name)\t\(.path)"')
            [ -n "$installables" ] || continue
            runner=$([ "$arch" = x86_64-linux ] && echo ubuntu-latest || echo ubuntu-26.04-arm)
            entries+=("$(jq -cn --arg i "$installables" --arg l "$arch" --arg r "$runner" '{label:$l, runner:$r, installables:$i}')")
          done
          matrix=$(IFS=,; printf '{include:[%s]}' "${entries[*]}")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$matrix"
